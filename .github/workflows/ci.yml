# Each crate's tests in a job of its own, so a failure says whose it is at a glance and the rest
# still run. The firmware builds for the board (no board here, so no flashing); on a `v*` tag its
# ELF goes into a GitHub release.
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  brain:
    name: brain (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The brain is no_std; its tests run on the host with the std flavor of MAVLink.
      - run: cargo test -p swarm-brain --features std

  mavlink-swarm:
    name: mavlink-swarm (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mavlink-swarm

  backend:
    name: backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests, and the examples built with them (smoke checks, fake board).
      - run: cargo test -p swarm-backend --all-targets

  gcs:
    name: gcs (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Bevy's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p swarm-gcs --all-targets

  viz:
    name: viz (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Bevy's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p swarm-viz --all-targets

  firmware:
    name: firmware (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware -> target
      # firmware/.cargo/config.toml picks the board's target and linker scripts.
      - run: cargo build --release
        working-directory: firmware
      - uses: actions/upload-artifact@v7
        with:
          name: swarm-firmware
          path: firmware/target/thumbv7em-none-eabihf/release/swarm-firmware

  # The ground station's and the remote's protocol checks, each against a backend of its own
  # (scripts/up.sh, as `make smoke` runs them).
  smoke:
    name: smoke (${{ matrix.check }})
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        check: [smoke-gcs, smoke-remote]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p swarm-backend --all-targets
      - run: scripts/up.sh ${{ matrix.check }}
        timeout-minutes: 10
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.check }}
          path: logs/

  release:
    name: release (firmware)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [brain, mavlink-swarm, backend, gcs, viz, firmware, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: swarm-firmware
      - uses: softprops/action-gh-release@v3
        with:
          files: swarm-firmware
          generate_release_notes: true
